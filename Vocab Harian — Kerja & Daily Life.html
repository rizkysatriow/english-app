<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FAF6EE; --ink:#20232A; --card:#FFFFFF; --border:#DED6C3; --muted:#8A8371;
  --teal:#2F6F6B; --amber:#C98A1B; --green:#2F8F5B; --red:#B3432B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1E22; --ink:#ECE7DA; --card:#262A30; --border:#3A3F46; --muted:#9AA0A6;
    --teal:#4FA69F; --amber:#E0A83D; --green:#4FBE84; --red:#E0665A;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1E22; --ink:#ECE7DA; --card:#262A30; --border:#3A3F46; --muted:#9AA0A6;
  --teal:#4FA69F; --amber:#E0A83D; --green:#4FBE84; --red:#E0665A;
}
*{box-sizing:inherit;}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
.wrap{max-width:480px;margin:0 auto;padding:22px 18px 48px;}
h1{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  font-size:21px;margin:0 0 3px;font-weight:600;}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px;line-height:1.4;}
.stat{font-size:13px;color:var(--muted);margin-bottom:6px;}
.bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:18px;}
.bar-fill{height:100%;background:var(--amber);}
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 14px;}
.day-chip{flex:0 0 auto;width:34px;height:34px;border-radius:8px;font-size:13px;
  border:1px solid var(--border);background:transparent;color:var(--muted);}
.day-chip.done{background:var(--teal);color:#fff;border-color:var(--teal);}
.day-chip.current{border-color:var(--amber);color:var(--ink);font-weight:700;}
.day-chip.locked{opacity:.35;}
h2{font-size:15px;margin:6px 0 10px;font-weight:600;}
.card{perspective:900px;height:142px;margin-bottom:10px;}
.card-inner{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d;}
.card.flipped .card-inner{transform:rotateY(180deg);}
@media (prefers-reduced-motion:reduce){.card-inner{transition:none;}}
.card-face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--border);
  border-radius:10px;background:var(--card);padding:14px 16px;display:flex;flex-direction:column;justify-content:center;}
.card-face strong{font-family:Georgia,serif;font-size:19px;}
.card-face span{font-size:12.5px;color:var(--muted);margin-top:4px;}
.card-back{transform:rotateY(180deg);}
.card-back strong{color:var(--teal);}
.card-back span.ex{color:var(--ink);font-size:13.5px;}
.card-back span.ex-id{color:var(--muted);font-size:12px;font-style:italic;margin-top:2px;}
.btn{display:block;width:100%;border:none;border-radius:10px;padding:13px 16px;font-size:15px;
  font-family:inherit;cursor:pointer;margin:6px 0;}
.btn-primary{background:var(--teal);color:#fff;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--ink);}
.note{color:var(--muted);font-size:13.5px;margin:6px 0;}
.divider{border-top:1px solid var(--border);margin:22px 0;}
.quiz-box{border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--card);}
.qcount{font-size:12.5px;color:var(--muted);margin:0 0 6px;}
.qword{font-family:Georgia,serif;font-size:20px;margin:0 0 14px;}
.quiz-opt{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px 14px;
  border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font-size:14.5px;}
.quiz-opt.correct{background:var(--green);color:#fff;border-color:var(--green);}
.quiz-opt.wrong{background:var(--red);color:#fff;border-color:var(--red);}
.reset{background:none;border:none;color:var(--muted);font-size:12.5px;text-decoration:underline;
  padding:0;margin-top:28px;cursor:pointer;}
.menu-card{display:block;width:100%;text-align:left;border:1px solid var(--border);border-radius:14px;
  padding:20px;margin-bottom:14px;background:var(--card);cursor:pointer;}
.menu-card strong{font-family:Georgia,serif;font-size:19px;display:block;margin-bottom:4px;}
.menu-card span{color:var(--muted);font-size:13.5px;}
.backlink{background:none;border:none;color:var(--teal);font-size:13.5px;padding:0;
  margin-bottom:14px;cursor:pointer;text-decoration:underline;}
</style>
</head>

let category=null;
let completed=[],unlocked=1,selDay=1,flipped=new Set(),quiz=null;

function storageKey(){return 'vocabProgress_'+category;}
function loadCompleted(){try{const a=JSON.parse(localStorage.getItem(storageKey())||'[]');const len=VOCAB[category].length;return Array.isArray(a)?a.filter(n=>n>=1&&n<=len):[];}catch(e){return [];}}
function saveCompleted(){try{localStorage.setItem(storageKey(),JSON.stringify(completed));}catch(e){}}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function chooseCategory(cat){category=cat;completed=loadCompleted();const len=VOCAB[category].length;unlocked=completed.length?Math.min(len,Math.max(...completed)+1):1;selDay=unlocked;flipped=new Set();quiz=null;render();}
function backToMenu(){category=null;render();}
function selectDay(d){if(d>unlocked)return;selDay=d;flipped=new Set();quiz=null;render();}
function flip(i){flipped.has(i)?flipped.delete(i):flipped.add(i);render();}
function completeToday(){const len=VOCAB[category].length;if(!completed.includes(selDay)){completed.push(selDay);saveCompleted();unlocked=Math.min(len,Math.max(...completed)+1);}render();}
function getPool(){const V=VOCAB[category];const days=[selDay-1,selDay-2].filter(d=>d>=1&&completed.includes(d));let w=[];days.forEach(d=>w.push(...V[d-1]));return w;}
function startQuiz(){const V=VOCAB[category];const ALL=V.flat();const pool=getPool();if(pool.length===0)return;const qCount=Math.min(5,pool.length);const chosen=shuffle(pool).slice(0,qCount);const questions=chosen.map(w=>{const distractors=shuffle(ALL.filter(x=>x[0]!==w[0])).slice(0,3).map(x=>x[1]);const opts=shuffle([w[1],...distractors]);return {en:w[0],correct:w[1],opts};});quiz={questions,idx:0,score:0,answered:false,selectedIdx:null,done:false};render();}
function answerQuiz(i){if(quiz.answered)return;quiz.answered=true;quiz.selectedIdx=i;const q=quiz.questions[quiz.idx];if(q.opts[i]===q.correct)quiz.score++;render();setTimeout(()=>{quiz.idx++;quiz.answered=false;quiz.selectedIdx=null;if(quiz.idx>=quiz.questions.length)quiz.done=true;render();},900);}
function resetProgress(){if(!confirm('Yakin mau hapus progres kategori ini?'))return;completed=[];try{localStorage.removeItem(storageKey());}catch(e){}unlocked=1;selDay=1;flipped=new Set();quiz=null;render();}

function renderMenu(){
  document.getElementById('app').innerHTML=`
    <h1>Vocab Harian</h1>
    <p class="sub">Pilih mau hafalin kosakata buat apa dulu. Progres tiap kategori kesimpen terpisah.</p>
    <button class="menu-card" onclick="chooseCategory('kerja')"><strong>💼 Kerja &amp; Meeting</strong><span>20 hari kosakata kantor &amp; rapat</span></button>
    <button class="menu-card" onclick="chooseCategory('harian')"><strong>🌤️ Kehidupan Sehari-hari</strong><span>20 hari kosakata dasar &amp; harian (termasuk kata dasar kayak must, should, dll)</span></button>
  `;
}
function renderDetail(){
  const V=VOCAB[category],len=V.length,label=LABELS[category];
  const daysHTML=V.map((_,idx)=>{const d=idx+1;let cls='day-chip';if(completed.includes(d))cls+=' done';else if(d>unlocked)cls+=' locked';if(d===selDay)cls+=' current';return `<button class="${cls}" ${d>unlocked?'disabled':''} onclick="selectDay(${d})">${d}</button>`;}).join('');
  const words=V[selDay-1];
  const cardsHTML=words.map((w,i)=>`<div class="card ${flipped.has(i)?'flipped':''}" onclick="flip(${i})"><div class="card-inner"><div class="card-face"><strong>${w[0]}</strong><span>Ketuk buat lihat arti</span></div><div class="card-face card-back"><strong>${w[1]}</strong><span class="ex">${w[2]}</span><span class="ex-id">${w[3]}</span></div></div></div>`).join('');
  let actionHTML='';
  if(completed.includes(selDay)){actionHTML=`<p class="note">✓ Sudah kamu hafalkan. Ketuk kartu buat baca ulang.</p>`;}
  else if(selDay===unlocked){actionHTML=`<button class="btn btn-primary" onclick="completeToday()">Tandai Hari Ini Selesai</button>`;}
  const poolLen=getPool().length;
  let quizHTML='';
  if(quiz&&!quiz.done){
    const q=quiz.questions[quiz.idx];
    quizHTML=`<div class="quiz-box"><p class="qcount">Soal ${quiz.idx+1}/${quiz.questions.length} • Skor: ${quiz.score}</p><p class="qword">${q.en}</p>${q.opts.map((o,i)=>`<button class="quiz-opt ${quiz.answered?(o===q.correct?'correct':(i===quiz.selectedIdx?'wrong':'')):''}" ${quiz.answered?'disabled':''} onclick="answerQuiz(${i})">${o}</button>`).join('')}</div>`;
  }else if(quiz&&quiz.done){
    quizHTML=`<div class="quiz-box"><p class="qword">Skor: ${quiz.score}/${quiz.questions.length}</p><button class="btn btn-primary" onclick="startQuiz()">Ulangi Kuis</button></div>`;
  }else{
    quizHTML=poolLen>0?`<button class="btn btn-outline" onclick="startQuiz()">🔁 Mulai Kuis Review (${poolLen} kata dari hari kemarin/kemarin lusa)</button>`:`<p class="note">Kuis review buat ngulang kata kemarin &amp; kemarin lusa bakal muncul mulai hari ke-2.</p>`;
  }
  document.getElementById('app').innerHTML=`
    <button class="backlink" onclick="backToMenu()">← Ganti kategori</button>
    <h1>${label.emoji} ${label.title}</h1>
    <p class="stat">Hari ${selDay} dari ${len} • ${completed.length} hari selesai • ${completed.length*5} kata dihafal</p>
    <div class="bar"><div class="bar-fill" style="width:${completed.length/len*100}%"></div></div>
    <div class="days">${daysHTML}</div>
    <h2>Kata Hari ${selDay}</h2>
    ${cardsHTML}
    ${actionHTML}
    <div class="divider"></div>
    <h2>Kuis Review</h2>
    ${quizHTML}
    <button class="reset" onclick="resetProgress()">Reset progres kategori ini</button>
  `;
}
function render(){category===null?renderMenu():renderDetail();}
render();
</script>
</body>
</html>
